
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <meta charset="UTF-8">
  <style>
    /* Estilos base del menú */
    .menum{
      font-size: 12px;
      font-weight: bold;
      color: white;
    }
    .menum ul.menu-horizontal {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      background-color: white;
      /*background-color: white; */
      color: red;
      border-radius: 10px 62px 65px 10px;
      -webkit-border-radius: 10px 62px 65px 10px;
      -moz-border-radius: 10px 62px 65px 10px; 
      border: 1px solid #ff6550; 
    }

    .menum ul.menu-horizontal li {
      position: relative;
    }

    .menum ul.menu-horizontal > li {
      padding: 0;
    }

    .menum ul.menu-horizontal > li > a {
      display: block;
      padding: 14px 20px;
      color: black;
      text-decoration: none;
      border-radius: 10px 62px 65px 10px;
      -webkit-border-radius: 10px 62px 65px 10px;
      -moz-border-radius: 10px 62px 65px 10px;
    }

    .menum ul.menu-horizontal > li > a:hover {
      background-color: black;
      color: yellow;
      border: 1px solid #ff6550;
    }

    /* Submenús */
    .menum ul.submenu, ul.submenu-nivel2 {
      display: none;
      position: absolute;
      background-color: white;
      color: yellow;
      list-style: none;
      margin: 0;
      padding: 0;
      min-width: 300px;
      z-index: 1000;
      margin: 1px;
      /*border-radius: 10px 62px 65px 10px; */
      border: 1px solid #ff6550;
    }

    .menum ul.submenu li a, ul.submenu-nivel2 li a {
      color: black;
      padding: 10px 15px;
      display: block;
      text-decoration: none;
      margin: 1px;
      
    }

    .menum ul.submenu li a:hover, ul.submenu-nivel2 li a:hover {
      background-color:yellow;
      color:black;
      width: 90%;
      /* border-radius: 63px 63px 63px 63px;
-webkit-border-radius: 63px 63px 63px 63px;
-moz-border-radius: 63px 63px 63px 63px; */
border: 1px solid #ff6550;
    }

    /* Mostrar submenu al pasar el mouse */
    .menum ul.menu-horizontal li:hover > ul.submenu {
      display: block;
    }

    /* Submenú de segundo nivel */
    .menum ul.submenu li:hover > ul.submenu-nivel2 {
      display: block;
      left: 100%;
      top: 0;
    }
    i{
      margin-right: 5px;
    }
  </style>
</head>
<body>
